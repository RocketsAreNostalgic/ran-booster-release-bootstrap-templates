name: Quality

on:
  pull_request:
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack-inputs:
    name: Pack inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"

      - name: Create deterministic pre-release pack inputs
        id: inputs
        shell: bash
        env:
          RAN_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          candidate_commit="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$candidate_commit"
          version="$(git show "${candidate_commit}:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));')"
          test -n "$version"
          test "$(git show "${candidate_commit}:.release-please-manifest.json" | jq -er '."."')" = "$version"
          [[ "$RAN_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]

          mkdir -p dist
          inputs='dist/ran-booster-release-bootstrap-templates-inputs.tar'
          git archive --format=tar --output="$inputs" "$candidate_commit" -- package.json profiles schema scripts src templates
          inputs_sha256="$(sha256sum "$inputs" | awk '{ print $1 }')"
          artifact_name="ran-booster-release-bootstrap-templates-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg quality_commit "$GITHUB_SHA" \
            --arg candidate_commit "$candidate_commit" \
            --arg version "$version" \
            --arg repository_id "$RAN_REPOSITORY_ID" \
            --arg sha256 "$inputs_sha256" \
            '{
              schema: "ran-booster-release-bootstrap-templates-ci-inputs",
              schema_version: 2,
              quality_commit: $quality_commit,
              candidate_commit: $candidate_commit,
              version: $version,
              repository_id: $repository_id,
              sha256: $sha256
            }' > dist/ran-booster-release-bootstrap-templates-ci-inputs.json

          printf 'artifact-name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload the verified pre-release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inputs.outputs.artifact-name }}
          path: |
            dist/ran-booster-release-bootstrap-templates-inputs.tar
            dist/ran-booster-release-bootstrap-templates-ci-inputs.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"
      - name: Validate fixtures and deterministic pack
        run: npm test
