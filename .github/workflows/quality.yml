name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack-inputs:
    name: Pack inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"

      - name: Build and verify the final tested pack twice
        env:
          RAN_REPOSITORY_ID: ${{ github.event.repository.id }}
          RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export TZ=UTC LC_ALL=C
          test "$(git rev-parse HEAD)" = "$RAN_SOURCE_SHA"
          version="$(node -p 'require("./package.json").version')"
          test "$(jq -er '."."' .release-please-manifest.json)" = "$version"
          bash scripts/build-pack.sh dist "$RAN_REPOSITORY_ID" "v$version" "$RAN_SOURCE_SHA"
          bash scripts/build-pack.sh "$RUNNER_TEMP/pack-two" "$RAN_REPOSITORY_ID" "v$version" "$RAN_SOURCE_SHA"
          cmp dist/ran-booster-release-bootstrap-templates.zip "$RUNNER_TEMP/pack-two/ran-booster-release-bootstrap-templates.zip"
          bash scripts/verify-pack.sh dist/ran-booster-release-bootstrap-templates.zip "$RAN_REPOSITORY_ID" "v$version" "$RAN_SOURCE_SHA"
          node scripts/pack-evidence.mjs dist/ran-booster-release-bootstrap-templates.zip dist

      - name: Upload exact tested bytes and exchange evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ran-booster-release-bootstrap-templates-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  baseline:
    name: Shared Node quality
    permissions:
      contents: read
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-node.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d
    with:
      node-version-file: package.json
      pnpm-version: '11.13.1'

  test:
    name: Quality
    if: ${{ always() }}
    needs:
      - baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared Node quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: test "$BASELINE_RESULT" = success

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - pack-inputs
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all local quality evidence
        env:
          PACK_INPUTS_RESULT: ${{ needs.pack-inputs.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$PACK_INPUTS_RESULT" = success
          test "$TEST_RESULT" = success
