name: Quality

on:
  pull_request:
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack-inputs:
    name: Pack inputs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"

      - name: Create deterministic pre-release pack inputs
        id: inputs
        shell: bash
        env:
          RAN_REPOSITORY_ID: ${{ github.event.repository.id }}
          RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          candidate_commit="$RAN_SOURCE_SHA"
          test -n "$candidate_commit"
          test "$(git rev-parse HEAD)" = "$candidate_commit"
          version="$(git show "${candidate_commit}:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));')"
          test -n "$version"
          test "$(git show "${candidate_commit}:.release-please-manifest.json" | jq -er '."."')" = "$version"
          [[ "$RAN_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]

          mkdir -p dist
          inputs='dist/ran-booster-release-bootstrap-templates-inputs.tar'
          git archive --format=tar --output="$inputs" "$candidate_commit" -- package.json profiles schema scripts src templates
          inputs_sha256="$(sha256sum "$inputs" | awk '{ print $1 }')"
          artifact_name="ran-booster-release-bootstrap-templates-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg quality_commit "$candidate_commit" \
            --arg candidate_commit "$candidate_commit" \
            --arg version "$version" \
            --arg repository_id "$RAN_REPOSITORY_ID" \
            --arg sha256 "$inputs_sha256" \
            '{
              schema: "ran-booster-release-bootstrap-templates-ci-inputs",
              schema_version: 2,
              quality_commit: $quality_commit,
              candidate_commit: $candidate_commit,
              version: $version,
              repository_id: $repository_id,
              sha256: $sha256
            }' > dist/ran-booster-release-bootstrap-templates-ci-inputs.json

          printf 'artifact-name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload the verified pre-release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inputs.outputs.artifact-name }}
          path: |
            dist/ran-booster-release-bootstrap-templates-inputs.tar
            dist/ran-booster-release-bootstrap-templates-ci-inputs.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    name: Shared Node quality
    permissions:
      contents: read
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-node.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d
    with:
      node-version-file: package.json
      pnpm-version: '11.13.1'

  test:
    name: Quality
    if: ${{ always() }}
    needs:
      - baseline
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require shared Node quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: test "$BASELINE_RESULT" = success

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - pack-inputs
      - test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require all local quality evidence
        env:
          PACK_INPUTS_RESULT: ${{ needs.pack-inputs.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$PACK_INPUTS_RESULT" = success
          test "$TEST_RESULT" = success
