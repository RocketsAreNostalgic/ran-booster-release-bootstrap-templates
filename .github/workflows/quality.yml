name: Quality

on:
  pull_request:
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack-inputs:
    name: Pack inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-candidate: ${{ steps.inputs.outputs.release-candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"

      - name: Create deterministic pre-release pack inputs
        id: inputs
        shell: bash
        env:
          RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RAN_PR_BASE: ${{ github.event.pull_request.base.ref }}
          RAN_PR_HEAD: ${{ github.event.pull_request.head.ref }}
          RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RAN_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail

          release_candidate=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request \
            && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
            && "$RAN_PR_BASE" == main \
            && "$RAN_PR_HEAD" == 'release-please--branches--main--components--ran-booster-release-bootstrap-templates' \
            && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            release_candidate=true
          fi

          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]] \
            && ! git diff --quiet "${GITHUB_SHA}^1" "$GITHUB_SHA" -- .release-please-manifest.json; then
            source_commit="$(git rev-parse "${GITHUB_SHA}^2")"
            test "$(git log -1 --format=%H "$GITHUB_SHA" -- .release-please-manifest.json)" = "$source_commit"
            test "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse "${source_commit}^{tree}")"
          fi

          version="$(git show "${source_commit}:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));')"
          test -n "$version"
          test "$(git show "${source_commit}:.release-please-manifest.json" | jq -er '."."')" = "$version"
          [[ "$RAN_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]

          mkdir -p dist
          inputs='dist/ran-booster-release-bootstrap-templates-inputs.tar'
          git archive --format=tar --output="$inputs" "$source_commit" -- package.json profiles schema scripts src templates
          inputs_sha256="$(sha256sum "$inputs" | awk '{ print $1 }')"
          artifact_name="ran-booster-release-bootstrap-templates-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg quality_commit "$GITHUB_SHA" \
            --arg source_commit "$source_commit" \
            --arg version "$version" \
            --arg repository_id "$RAN_REPOSITORY_ID" \
            --arg sha256 "$inputs_sha256" \
            '{
              schema: "ran-booster-release-bootstrap-templates-ci-inputs",
              schema_version: 1,
              quality_commit: $quality_commit,
              source_commit: $source_commit,
              version: $version,
              repository_id: $repository_id,
              sha256: $sha256
            }' > dist/ran-booster-release-bootstrap-templates-ci-inputs.json

          {
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'release-candidate=%s\n' "$release_candidate"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the verified pre-release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inputs.outputs.artifact-name }}
          path: |
            dist/ran-booster-release-bootstrap-templates-inputs.tar
            dist/ran-booster-release-bootstrap-templates-ci-inputs.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: Quality
    needs: pack-inputs
    if: ${{ needs.pack-inputs.outputs.release-candidate != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"
      - name: Validate fixtures and deterministic pack
        run: npm test
