name: Release Please

on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: "release-please-main"
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: >-
      ${{
        github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the exact Quality commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.0"

      - name: Prove an exact merged Release Please candidate before mutation
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_QUALITY_COMMIT"

          if git diff --quiet "${RAN_QUALITY_COMMIT}^1" "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json; then
            echo 'release-required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_head="$(git rev-parse "${RAN_QUALITY_COMMIT}^2")"
          pulls="$RUNNER_TEMP/release-please-pulls.json"
          gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${release_head}/pulls" > "$pulls"
          decision="$(node scripts/release-candidate.mjs \
            "$RAN_QUALITY_COMMIT" \
            "$GITHUB_REPOSITORY" \
            main \
            'release-please--branches--main--components--ran-booster-release-bootstrap-templates' \
            "$pulls")"
          release_pr_number="$(jq -er '.release_pr_number' <<< "$decision")"
          pending="$(jq -er '.pending' <<< "$decision")"
          tagged="$(jq -er '.tagged' <<< "$decision")"
          tag="$(jq -er '.tag' <<< "$decision")"
          version="$(jq -er '.version' <<< "$decision")"

          release_decision="$(bash scripts/upload-pack.sh inspect "$tag" "$RAN_QUALITY_COMMIT" false)"
          state="$(jq -er '.state' <<< "$release_decision")"
          release_id="$(jq -er '.release_id' <<< "$release_decision")"
          [[ "$state" == published ]] && release_pending=false || release_pending=true

          if [[ "$release_pending" == true ]]; then
            test "$pending" = true
            test "$tagged" = false
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$RAN_QUALITY_COMMIT"
          elif [[ "$pending" != true && "$tagged" != true ]]; then
            echo '::error::The published release PR has neither the pending nor tagged Release Please label.'
            exit 1
          fi

          printf 'release-required=true\n' >> "$GITHUB_OUTPUT"
          {
            printf 'PACK_COMMIT=%s\n' "$RAN_QUALITY_COMMIT"
            printf 'PACK_PR_HEAD=%s\n' "$release_head"
            printf 'PACK_PENDING=%s\n' "$release_pending"
            printf 'PACK_PR_NUMBER=%s\n' "$release_pr_number"
            printf 'PACK_RELEASE_ID=%s\n' "$release_id"
            printf 'PACK_STATE=%s\n' "$state"
            printf 'PACK_TAG=%s\n' "$tag"
            printf 'PACK_VERSION=%s\n' "$version"
          } >> "$GITHUB_ENV"

      - name: Open or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Download the exact inputs tested by Quality
        if: steps.release-state.outputs.release-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-booster-release-bootstrap-templates-inputs-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify the downloaded pre-release inputs
        if: steps.release-state.outputs.release-required == 'true'
        env:
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RAN_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          metadata='dist/ran-booster-release-bootstrap-templates-ci-inputs.json'
          inputs='dist/ran-booster-release-bootstrap-templates-inputs.tar'
          test -f "$metadata"
          test -f "$inputs"
          inputs_sha256="$(jq -er '.sha256' "$metadata")"
          jq -e \
            --arg quality_commit "$RAN_QUALITY_COMMIT" \
            --arg candidate_commit "$PACK_COMMIT" \
            --arg version "$PACK_VERSION" \
            --arg repository_id "$RAN_REPOSITORY_ID" \
            '.schema == "ran-booster-release-bootstrap-templates-ci-inputs"
              and .schema_version == 2
              and .quality_commit == $quality_commit
              and .candidate_commit == $candidate_commit
              and .version == $version
              and .repository_id == $repository_id
              and (.sha256 | test("^[0-9a-f]{64}$"))' \
            "$metadata" >/dev/null
          printf '%s  %s\n' "$inputs_sha256" "$inputs" | sha256sum --check --strict
          tar -tf "$inputs" | grep -Eq '^package.json$'
          if tar -tf "$inputs" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo '::error::The tested pack inputs contain an unsafe path.'
            exit 1
          fi
          expected="$RUNNER_TEMP/ran-booster-release-bootstrap-templates-inputs.tar"
          git archive --format=tar --output="$expected" "$PACK_COMMIT" -- package.json profiles schema scripts src templates
          cmp -s "$inputs" "$expected"

      - name: Create or reuse one empty draft
        if: steps.release-state.outputs.release-required == 'true' && env.PACK_PENDING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PACK_STATE" == absent ]]; then
            gh release create "$PACK_TAG" --draft --target "$PACK_COMMIT" --title "$PACK_TAG" --generate-notes
          fi
          release_decision="$(bash scripts/upload-pack.sh inspect "$PACK_TAG" "$PACK_COMMIT" false)"
          test "$(jq -er '.state' <<< "$release_decision")" = draft
          release_id="$(jq -er '.release_id' <<< "$release_decision")"
          printf 'PACK_RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Finalize the release-ID-bound pack once
        if: steps.release-state.outputs.release-required == 'true'
        env:
          PACK_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/.ran-booster-template-pack-dist"
          install -d "$output"
          test "$(git show "${PACK_COMMIT}:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));')" = "$PACK_VERSION"
          bash scripts/build-pack.sh \
            "$output" \
            "$PACK_REPOSITORY_ID" \
            "$PACK_RELEASE_ID" \
            "$PACK_TAG" \
            "$PACK_COMMIT"

      - name: Attach and read back the verified pack
        if: steps.release-state.outputs.release-required == 'true' && env.PACK_PENDING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/upload-pack.sh verify \
            "$PACK_TAG" \
            ".ran-booster-template-pack-dist/ran-booster-release-bootstrap-templates.zip" \
            "$PACK_RELEASE_ID" \
            "$PACK_COMMIT" \
            false \
            pending

      - name: Publish only under the immutable-release contract
        if: steps.release-state.outputs.release-required == 'true' && env.PACK_PENDING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.RAN_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$IMMUTABLE_RELEASES_ENABLED" != true ]]; then
            echo '::error::Enable GitHub immutable releases and set RAN_IMMUTABLE_RELEASES_ENABLED=true. The verified pack remains a draft.'
            exit 1
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$PACK_COMMIT"
          gh release edit "$PACK_TAG" --draft=false --latest
          immutable=false
          for delay in 0 2 2 2 2; do
            sleep "$delay"
            if immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PACK_TAG}" --jq '.immutable' 2>/dev/null)" \
              && [[ "$immutable" == true ]]; then break; fi
          done
          test "$immutable" = true

      - name: Read back the immutable release and reconcile its exact PR
        if: steps.release-state.outputs.release-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/upload-pack.sh verify \
            "$PACK_TAG" \
            ".ran-booster-template-pack-dist/ran-booster-release-bootstrap-templates.zip" \
            "$PACK_RELEASE_ID" \
            "$PACK_COMMIT" \
            false \
            published

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PACK_PR_NUMBER}" --jq '[.labels[].name]')"
          if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
            jq -nc '{labels: ["autorelease: tagged"]}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PACK_PR_NUMBER}/labels" --input - >/dev/null
          fi
          if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PACK_PR_NUMBER}/labels/autorelease%3A%20pending" >/dev/null
          fi
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PACK_PR_NUMBER}" --jq '[.labels[].name]')"
          jq -e 'index("autorelease: tagged") != null and index("autorelease: pending") == null' <<< "$labels" >/dev/null
